# Цены и выкладка сайта.
#  • Каждые 15 минут скачивает Excel-файл с Яндекс Диска (секрет PRICES_URL).
#    Если цены изменились — сохраняет их в src/data/prices.json и пересобирает сайт:
#    превью на GitHub Pages и хостинг (если он настроен).
#  • При каждой правке кода в ветке main — то же самое, плюс выкладка кода.
#  • Вручную кнопкой Run workflow (там же галочка для резкого изменения цен).
# Репозиторий публичный, поэтому минуты GitHub Actions бесплатны.
name: Сайт и цены

on:
  push:
    branches: [main]
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      allow_jump:
        description: Разрешить резкое изменение цен (больше чем в 3 раза)
        type: boolean
        default: false

permissions:
  contents: write   # сохранить новые цены в репозитории
  actions: write    # запустить пересборку превью на GitHub Pages

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  prices:
    name: Цены из Excel
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.prices.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Забрать цены из Excel
        id: prices
        env:
          PRICES_URL: ${{ secrets.PRICES_URL }}
          PRICES_ALLOW_JUMP: ${{ inputs.allow_jump && '1' || '' }}
        run: node scripts/fetch-prices.mjs

      - name: Сохранить новые цены в репозитории
        if: steps.prices.outputs.changed == 'true'
        run: |
          git config user.name "Цены с Яндекс Диска"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/prices.json
          git commit -m "Цены обновлены из Excel"
          git push || (git pull --rebase origin main && git push)

      - name: Пересобрать превью на GitHub Pages
        if: steps.prices.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "${{ github.repository }}"

  site:
    name: Сборка и выкладка на хостинг
    needs: prices
    # Ошибка в Excel не мешает выложить правку кода: сайт соберётся со старыми ценами,
    # а запуск всё равно будет помечен красным (упал шаг с ценами) — придёт письмо.
    # По расписанию сайт собирается, только если цены действительно изменились.
    if: always() && (github.event_name != 'schedule' || needs.prices.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Собрать сайт
        env:
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
        run: npm run build

      # Выкладка по FTP (вход по SSH на хостинг RU-CENTER не заработал — сервер обрывает соединение). Пользователь FTP открывается сразу
      # в папке сайта docs. Загружаются только изменённые файлы; удалённые из кода — удаляются и на хостинге.
      # Список выложенного хранится на хостинге в .ftp-deploy-sync-state.json (из браузера закрыт в .htaccess).
      # Файл zayavka-config.php и журнал заявок лежат уровнем выше docs — выкладка их не видит и не трогает.
      - name: Проверить настройки хостинга
        id: ftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "$FTP_HOST" ]; then echo "Хостинг ещё не настроен (нет секрета FTP_HOST) — выкладку пропускаю."; echo "on=false" >> "$GITHUB_OUTPUT"
          else echo "on=true" >> "$GITHUB_OUTPUT"; fi

      - name: Выложить на хостинг по FTP
        if: steps.ftp.outputs.on == 'true'
        uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b # v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose   # сертификат FTP-сервера RU-CENTER выписан на другое имя; шифрование остаётся
          local-dir: ./dist/
          server-dir: ./
          timeout: 120000
