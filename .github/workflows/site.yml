# Собирает сайт и выкладывает его на хостинг:
#  • при каждой правке кода в ветке main;
#  • каждые 30 минут — если в Excel-файле на Яндекс Диске изменились цены;
#  • вручную кнопкой Run workflow.
name: Сайт и цены

on:
  push:
    branches: [main]
  # Проверка цен каждые 30 минут. Включить, когда выбран вариант «обычный хостинг + GitHub»
  # (при VPS цены обновляет сам сервер). Расход: ~1 500 минут Actions в месяц.
  # schedule:
  #   - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      allow_jump:
        description: Разрешить резкое изменение цен (больше чем в 3 раза)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Забрать цены из Excel
        id: prices
        env:
          PRICES_URL: ${{ secrets.PRICES_URL }}
          PRICES_ALLOW_JUMP: ${{ inputs.allow_jump && '1' || '' }}
        run: node scripts/fetch-prices.mjs

      - name: Сохранить новые цены в репозитории
        if: steps.prices.outputs.changed == 'true'
        run: |
          git config user.name "Цены с Яндекс Диска"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/prices.json
          git commit -m "Цены обновлены из Excel"
          git push

      - name: Собрать сайт
        if: github.event_name != 'schedule' || steps.prices.outputs.changed == 'true'
        env:
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}
        run: npm run build

      - name: Выложить на хостинг
        if: github.event_name != 'schedule' || steps.prices.outputs.changed == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_HOST" ]; then echo "Хостинг ещё не настроен (нет секрета SSH_HOST) — выкладку пропускаю."; exit 0; fi
          case "$DEPLOY_PATH" in ""|"/"|"~"|"~/") echo "DEPLOY_PATH не задан или опасен"; exit 1;; esac
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -p ${SSH_PORT:-22}" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
